spring.application.name=auth-service

server.port=8081

# Spring config properties
spring.config.import=optional:file:.env[.properties]

# PostgreSQL
spring.datasource.url=jdbc:postgresql://users_db:5432/${KEY_POSTGRES_USERS_DB}
spring.datasource.username=${KEY_POSTGRES_USERS_USER}
spring.datasource.password=${KEY_POSTGRES_USERS_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Security and JWT
api.security.token.secret=${JWT_SECRET:my-secret-key}
logging.level.org.springframework.security=DEBUG
server.error.include-message=always

spring.ai.vectorstore.redis.enabled=false

# Redis
spring.data.redis.host=redis_cache
spring.data.redis.port=6379

# Kafka e Zookeeper
spring.kafka.bootstrap-servers=kafka:29092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
