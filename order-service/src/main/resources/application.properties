spring.application.name=order-service

server.port=8082

# Spring config properties
spring.config.import=optional:file:.env[.properties]

# PostgreSQL
spring.datasource.url=jdbc:postgresql://orders_db:5433/${KEY_POSTGRES_ORDERS_DB}
spring.datasource.username=${KEY_POSTGRES_ORDERS_USER}
spring.datasource.password=${KEY_POSTGRES_ORDERS_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Kafka Config
spring.kafka.bootstrap-servers=kafka:29092

# Kafka Consumer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Kafka Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping=orderCreated:com.example.order_service.infra.kafka.events.OrderCreatedEvent

# Security
api.security.token.secret=${JWT_SECRET:my-secret-key}

# Cache Redis
spring.data.redis.host=redis_cache
spring.data.redis.port=6379