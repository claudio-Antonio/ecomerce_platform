spring.application.name=order-service

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/orders
spring.datasource.username=user
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Kafka Consumer
#spring.kafka.consumer.group-id=order-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=stockReserved:com.example.order_service.infra.kafka.events.StockReservedEvent,stockFailed:com.example.order_service.infra.kafka.events.StockFailedEvent

# Kafka Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer


# Security
api.security.token.secret=${JWT_SECRET:my-secret-key}

# Cache Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379